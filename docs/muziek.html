<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muziek proberen</title>
<style>
body{margin:0;background:#0E2E2A;color:#F6EFE0;font:16px/1.6 system-ui,-apple-system,sans-serif;padding:24px}
main{max-width:720px;margin:0 auto}
h1{font:italic 600 34px/1.1 Georgia,serif;margin:0 0 8px}
h2{font:italic 600 24px/1.2 Georgia,serif;margin:0}
a{color:#F0B23F}
p,.meta{color:#C9D3CC}
.key{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}
input{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid #3C5E58;background:#163C37;color:#F6EFE0;font:inherit}
button{padding:10px 16px;border-radius:999px;border:0;background:#F0B23F;color:#0E2E2A;font:600 15px system-ui,sans-serif;cursor:pointer}
button.ghost{background:transparent;color:#F0B23F;border:1px solid #F0B23F}
button:focus-visible,input:focus-visible{outline:2px solid #F6EFE0;outline-offset:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:#163C37;color:#F6EFE0}
.tabs button[aria-pressed=true]{background:#F0B23F;color:#0E2E2A}
.now{position:sticky;top:0;background:#0E2E2A;padding:12px 0;border-bottom:1px solid #3C5E58;margin-bottom:12px}
.now strong{display:block}
audio{width:100%;margin-top:8px}
ol{list-style:none;padding:0;margin:0}
li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #1F4741}
li.playing{color:#F0B23F}
li .t{flex:1;min-width:0}
li .t span{display:block;font-size:13px;color:#9FB3AB;overflow-wrap:anywhere}
li button{padding:6px 12px;font-size:14px}
.err{color:#F4A38C}
</style>
</head>
<body><main>
<h1>Muziek proberen</h1>
<p>Dezelfde zoekopdrachten bij Jamendo (rechtenvrij, Creative Commons) die de screensaver zou gebruiken.
Kies een stijl en druk op <b>Speel door elkaar</b>: dan hoor je het zoals op de tv, een willekeurig nummer en daarna het volgende.</p>

<form class="key" id="keyform">
  <input id="clientid" placeholder="Jamendo Client ID (dezelfde als op de tv)" autocomplete="off">
  <button type="submit">Ophalen</button>
</form>

<div class="tabs" id="tabs"></div>
<div class="now" id="now" hidden>
  <strong id="nowtitle"></strong><span class="meta" id="nowtags"></span>
  <audio id="audio" controls></audio>
</div>
<div id="list"></div>

<script>
const STYLES = {
  jazz:   { name: "Jazz (zoals nu)",        q: "&fuzzytags=jazz+lounge+smoothjazz+easylistening&speed=low+medium" },
  piano:  { name: "Rustige piano",          q: "&tags=piano&fuzzytags=easylistening+relaxation+calm+romantic+lounge&speed=verylow+low+medium" },
  gitaar: { name: "Spaanse gitaar",         q: "&tags=guitar&fuzzytags=spanish+flamenco+spanishguitar+latin+acoustic&speed=low+medium" },
};
const cache = {};
let current = null, tracks = [], playingId = null, shuffle = false;
const $ = id => document.getElementById(id);
const audio = $("audio");

try { $("clientid").value = localStorage.getItem("jamendo") || ""; } catch (e) {}

$("tabs").innerHTML = Object.entries(STYLES)
  .map(([k, s]) => `<button type="button" data-k="${k}" aria-pressed="false">${s.name}</button>`).join("");
$("tabs").addEventListener("click", e => { const k = e.target.dataset.k; if (k) load(k); });
$("keyform").addEventListener("submit", e => {
  e.preventDefault();
  try { localStorage.setItem("jamendo", $("clientid").value.trim()); } catch (e) {}
  for (const k in cache) delete cache[k];
  load(current || "piano");
});

async function load(k) {
  current = k;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
  const id = $("clientid").value.trim();
  if (!id) { $("list").innerHTML = `<p class="err">Vul eerst je Jamendo Client ID in. Die staat op devportal.jamendo.com bij je app.</p>`; return; }
  $("list").innerHTML = `<p>Ophalen…</p>`;
  try {
    if (!cache[k]) {
      const url = "https://api.jamendo.com/v3.0/tracks/?format=json&limit=200&audioformat=mp32" +
        "&order=popularity_total&vocalinstrumental=instrumental&include=musicinfo" +
        STYLES[k].q + "&client_id=" + encodeURIComponent(id);
      const json = await (await fetch(url)).json();
      if (json.headers && json.headers.status !== "success") throw new Error(json.headers.error_message || "Jamendo gaf een fout");
      cache[k] = json.results || [];
    }
    tracks = cache[k];
    render();
  } catch (e) {
    $("list").innerHTML = `<p class="err">Lukt niet: ${e.message}. Klopt de Client ID?</p>`;
  }
}

function tagsOf(t) {
  const m = t.musicinfo && t.musicinfo.tags;
  return m ? [...(m.genres || []), ...(m.instruments || []), ...(m.vartags || [])].slice(0, 6).join(", ") : "";
}

function render() {
  $("list").innerHTML = `<p class="meta">${tracks.length} nummers gevonden.
    <button type="button" id="shuffle">Speel door elkaar</button></p><ol>` +
    tracks.map((t, i) => `<li data-i="${i}" class="${t.id === playingId ? "playing" : ""}">
      <button type="button" class="ghost" data-i="${i}">▶</button>
      <div class="t">${t.name} · ${t.artist_name}<span>${tagsOf(t)}</span></div>
      <a href="${t.shareurl}" target="_blank" rel="noopener">Jamendo</a></li>`).join("") + `</ol>`;
  $("shuffle").onclick = () => { shuffle = true; playRandom(); };
  $("list").querySelectorAll("li button").forEach(b => b.onclick = () => { shuffle = false; play(tracks[+b.dataset.i]); });
}

function play(t) {
  if (!t) return;
  playingId = t.id;
  $("now").hidden = false;
  $("nowtitle").textContent = `${t.name} · ${t.artist_name}`;
  $("nowtags").textContent = tagsOf(t);
  audio.src = t.audio;
  audio.play();
  document.querySelectorAll("#list li").forEach(li => li.classList.toggle("playing", tracks[+li.dataset.i]?.id === t.id));
}

function playRandom() { play(tracks[Math.floor(Math.random() * tracks.length)]); }
audio.addEventListener("ended", () => { if (shuffle) playRandom(); });
audio.addEventListener("error", () => { if (shuffle) playRandom(); });
</script>
</main></body>
</html>
