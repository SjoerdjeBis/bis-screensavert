name: Toen en Natuur ophalen

on:
  workflow_dispatch:
    inputs:
      bronnen:
        description: "Welke bronnen ophalen (JSON-lijst); [] = alleen opnieuw bouwen"
        required: false
        default: '["natuur", "toen"]'
  push:
    paths: ["tools/build_extra.py"]

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  BOT_NAME: toen-natuur
  GH_TOKEN: ${{ github.token }}

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' && inputs.bronnen != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        bron: ${{ fromJSON(inputs.bronnen) }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy
      - name: Beelden ophalen en keuren
        env:
          NASA_KEY: ${{ secrets.NASA_KEY }}
        run: python3 tools/fetch_extra.py ${{ matrix.bron }}
      - name: Resultaat vastleggen
        run: |
          mv data/extra/afgekeurd.json data/extra/afgekeurd_${{ matrix.bron }}.json
          tools/bot_push.sh "Beelden voor ${{ matrix.bron }} ophalen" data/extra/

  build:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Wat de ophaaljobs al vastlegden erbij halen
        run: |
          target="$(tools/bot_branch.sh)"
          if [ "$target" != "${GITHUB_REF_NAME}" ] && git ls-remote --exit-code --heads origin "$target" >/dev/null; then
            git fetch origin "$target"
            git checkout -B work FETCH_HEAD
          fi
      - name: App-bestanden bouwen
        run: python3 tools/build_extra.py
      - name: Resultaat vastleggen
        run: tools/bot_push.sh "Beelden voor Toen en Natuur bijwerken" app/src/main/assets/
      - name: Pull request naar main
        run: tools/bot_pr.sh "Beelden voor Toen en Natuur bijwerken"
