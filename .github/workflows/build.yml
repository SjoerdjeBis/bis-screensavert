name: Bouw Bis ScreenSaver

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bouw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: App bouwen
        run: ./gradlew --no-daemon assembleRelease

      - name: Downloadbestanden maken
        run: |
          # De app los, met het versienummer erbij, voor Downloader en het bijwerken vanaf de tv.
          cp app/build/outputs/apk/release/app-release.apk BisScreensavert.apk
          echo "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"0.1.${{ github.run_number }}\"}" > versie.json

      - name: Downloadpagina bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete laatste --yes --cleanup-tag || true
          gh release create laatste BisScreensavert.apk versie.json \
            --target "${{ github.sha }}" \
            --title "Bis Screensavert – laatste versie" \
            --notes "Versie 0.1.${{ github.run_number }} (branch ${{ github.ref_name }}). Installeren en gebruik: installatie/HANDLEIDING.md in de repository." \
            --prerelease
