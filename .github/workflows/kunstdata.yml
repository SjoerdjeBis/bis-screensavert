name: Kunstdata ophalen

on:
  workflow_dispatch:
  push:
    paths: ["tools/fetch_art.py", "tools/fetch_sources.py"]

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  BOT_NAME: kunstdata
  GH_TOKEN: ${{ github.token }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Art Institute of Chicago (alleen als er nog niets is)
        run: test -f data/aic_raw.json || python3 tools/fetch_art.py
      - name: Cleveland, Rijksmuseum en vingerafdrukken
        run: python3 tools/fetch_sources.py
      - name: Resultaat vastleggen
        run: tools/bot_push.sh "Kunstdata van extra musea bijwerken" data/
      - name: Pull request naar main
        run: tools/bot_pr.sh "Kunstdata van extra musea bijwerken"
