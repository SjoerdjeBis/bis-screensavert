name: Kunstdata ophalen

on:
  workflow_dispatch:
  push:
    paths: ["tools/fetch_art.py", "tools/fetch_sources.py"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Art Institute of Chicago (alleen als er nog niets is)
        run: test -f data/aic_raw.json || python3 tools/fetch_art.py
      - name: Cleveland, Rijksmuseum en vingerafdrukken
        run: python3 tools/fetch_sources.py
      - name: Resultaat vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Kunstdata van extra musea bijwerken"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
