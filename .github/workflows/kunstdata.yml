name: Kunstdata ophalen

on:
  workflow_dispatch:
  push:
    paths: ["tools/fetch_art.py"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_art.py
      - name: Resultaat vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aic_raw.json
          git diff --cached --quiet || git commit -m "Kunstdata van het Art Institute of Chicago bijwerken"
          git push
