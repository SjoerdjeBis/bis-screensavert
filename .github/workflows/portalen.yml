name: Portalen opnemen

# Neemt clips op uit Portals (github.com/emollick/ai-portals, CC BY-NC-SA 4.0) en zet ze op de release
# "portalen", waar de app ze vandaan streamt. Elke clip is een paar werelden: de eerste helemaal, het portaal en
# de tweede helemaal (zo'n 80 tot 110 seconden). Zonder grafische kaart kost één clip uren, dus elk paar krijgt
# een eigen job.
on:
  workflow_dispatch:
    inputs:
      werelden:
        description: "Welke werelden, per twee een clip (JSON-lijst met id's); [] = de openingswerelden van het project"
        required: false
        default: "[]"
      vervangen:
        description: "ja = na afloop alle andere clips van de release weghalen; nee = erbij zetten"
        required: false
        default: "nee"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # De versie van Portals waarmee de opnames zijn getest.
  PORTALS_COMMIT: 210133f4e718acb7b461f2a40c90661a40a2397f

jobs:
  lijst:
    runs-on: ubuntu-latest
    outputs:
      lijst: ${{ steps.kies.outputs.lijst }}
    steps:
      - uses: actions/checkout@v4
      - name: Portals ophalen
        run: |
          git clone https://github.com/emollick/ai-portals.git portals
          git -C portals checkout "$PORTALS_COMMIT"
      - id: kies
        env:
          WERELDEN: ${{ inputs.werelden }}
        run: echo "lijst=$(node tools/portalen/kies.mjs portals "$WERELDEN")" >> "$GITHUB_OUTPUT"
      - name: Release klaarzetten
        run: |
          gh release view portalen >/dev/null 2>&1 || gh release create portalen --prerelease \
            --title "Portalen – clips voor de screensaver" \
            --notes "Vluchten van een minuut door de werelden van [Portals](https://github.com/emollick/ai-portals) van Ethan Mollick, opgenomen met tools/portalen. Licentie: [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/); delen en bewerken mag niet-commercieel, met naamsvermelding en onder dezelfde licentie. De app Bis Screensavert streamt deze bestanden."

  opnemen:
    needs: lijst
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJSON(needs.lijst.outputs.lijst) }}
    steps:
      - uses: actions/checkout@v4
      - name: Portals ophalen
        run: |
          git clone https://github.com/emollick/ai-portals.git portals
          git -C portals checkout "$PORTALS_COMMIT"
      - name: Browser en ffmpeg
        run: |
          npm install --no-save --prefix tools/portalen playwright@^1.50.0
          npx --prefix tools/portalen playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Clip opnemen
        env:
          # Opnametijd binnen de 350 minuten van de job, met ruimte voor coderen en uploaden. De schatting rekent
          # al met een marge voor het zwaardere portaal; past het niet, dan zonder kantgladmaken, en anders 720p.
          MAX_UREN: "4.6"
        run: |
          cd tools/portalen
          node record.mjs ../../portals "${{ matrix.clip.wereld }}" "${{ matrix.clip.volgende }}" "${{ matrix.clip.naam }}.mp4" 24 1920 1080
      - name: Op de release zetten
        env:
          TITEL: ${{ matrix.clip.titel }}
        run: gh release upload portalen "tools/portalen/${{ matrix.clip.naam }}.mp4#${TITEL}" --clobber

  opruimen:
    needs: [lijst, opnemen]
    # Alleen als alles gelukt is: anders blijven de oude clips staan.
    if: inputs.vervangen == 'ja' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Andere clips van de release weghalen
        env:
          LIJST: ${{ needs.lijst.outputs.lijst }}
        run: |
          keep=$(echo "$LIJST" | jq -r '.[].naam + ".mp4"')
          gh release view portalen --json assets --jq '.assets[].name' | while read -r name; do
            if ! grep -qxF "$name" <<< "$keep"; then gh release delete-asset portalen "$name" --yes; fi
          done
