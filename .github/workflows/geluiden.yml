name: Geluiden ophalen

on:
  workflow_dispatch:
  push:
    paths: ["tools/fetch_sounds.py"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 tools/fetch_sounds.py
      - name: Resultaat vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/res app/src/main/assets
          git diff --cached --quiet || git commit -m "Geluiden van Wikimedia Commons bijwerken"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
